name: Build Release APK

on:
  push:
    branches: [ main, master, v* ]
  tag:
    - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize Android Platform Scaffolding
        run: flutter create . --org com.motioncut.pro --project-name motioncut_pro --platforms=android

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze || true

      - name: Build Android Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
