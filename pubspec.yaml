name: motioncut_pro
description: "A production-ready mobile video editor app in Flutter inspired by CapCut & Alight Motion with offline FFmpeg engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  video_player: ^2.8.2
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/samples/
